workflows:
  android-build:
    name: Song2Video AI - Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate missing native project files
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.song2video.ai .
          fi
          sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i '' 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          cp google-services.json android/app/google-services.json
          perl -i -pe 'print "    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false\n" if /id\("org.jetbrains.kotlin.android"\)/' android/settings.gradle.kts
          perl -i -pe 'print "    id(\"com.google.gms.google-services\")\n" if /id\("com.android.application"\)/' android/app/build.gradle.kts
          echo "----- settings.gradle.kts -----"
          cat android/settings.gradle.kts
          echo "----- app/build.gradle.kts (top) -----"
          head -30 android/app/build.gradle.kts
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK (debug, unsigned)
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
