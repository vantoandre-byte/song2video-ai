name: song2video_ai
description: Auto-generate cinematic music videos from AI-generated songs.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7

  # Networking
  dio: ^5.5.0
  http: ^1.2.1

  # Audio handling / analysis
  just_audio: ^0.9.40
  audio_waveforms: ^1.1.0
  file_picker: ^8.0.5

  # Video
  video_player: ^2.9.1
  

  # Local storage / caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # UI
  google_fonts: ^6.2.1
  reorderables: ^0.6.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  flutter_svg: ^2.0.10

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.4.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
  
    
